name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. 环境准备：拉高到 Node 22，适配新版 Wrangler 编译器
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install Dependencies
        run: pnpm install --no-frozen-lockfile

      # 2. 预处理：同时干掉 wrangler.toml 里的 KV 命名空间和旧的 main 入口指向，防止其干扰构建
      - name: Fix wrangler.toml configuration
        run: |
          sed -i '/kv_namespaces/,/\]/d' wrangler.toml
          echo "==== Modified wrangler.toml ===="
          cat wrangler.toml

      # 3. 部署动作：直接将打包命令交给官方自带的 worker-build，并将入口直接指向编译后的单文件
      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # 核心修正：直接使用编译生成的产物作为部署入口，彻底解决 [custom build] 完找不到 src/index.ts 的报错
          command: deploy dist-worker/index.mjs --name rsshub
